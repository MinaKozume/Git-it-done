{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}KAFEI{% endblock %}</title>

  
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">


    {% block extra_css %}
    {% endblock %}


    <style>
        body { font-family: Arial, sans-serif; }
        

        footer {
            background: white;
            padding: 40px 0;
            border-top: 1px solid #eee;
            margin-top: 50px;
        }
        footer h5 {
            font-weight: 600;
        }
        footer a {
            color: black;
            text-decoration: none;
            display: block;
            margin-bottom: 6px;
        }
    </style>
</head>

<body>


<div class="container">
    {% block content %}
    {% endblock %}
</div>


<footer>
    <div class="container d-flex justify-content-between flex-wrap">

        <div class="mb-3">
            <h4>Kafei</h4>
        </div>

        <div class="mb-3">
            <h5>About Us</h5>
            <a href="{% url 'homepage:homepage' %}">Landing Page</a>
            <a class="nav-link" href="{% url 'about:about' %}">About</a>
        </div>

        <div class="mb-3">
            <h5>Product</h5>
            <a href="{% url 'menu:menu_home' %}">Menu</a>
            <a href="{% url 'reviews:reviews' %}">Reviews</a>
        </div>

        <div class="mb-3">
            <h5>Deals</h5>
            <a href="{% url 'deals:deals' %}">Deals Page</a>
        </div>

    </div>
</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

{% block extra_js %}

{% endblock %}

</body>
</html>
