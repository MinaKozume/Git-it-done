{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}KAFEI{% endblock %}</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    {% block extra_css %}
    {% endblock %}

    <style>
        body { font-family: Arial, sans-serif; }


        .navbar-custom {
            background: white;
            padding: 20px 0;
            border-bottom: 1px solid #eee;
        }
        .navbar-custom a {
            color: black;
            font-size: 1.1rem;
            margin: 0 15px;
            text-decoration: none;
        }
        .navbar-brand {
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .login-btn2 {
            background-color: black !important;
            color: white !important;
            padding: 10px 18px;
            border-radius: 7px;
            text-decoration: none;
            display: inline-block;
        }

        .login-btn2:hover {
            background-color: #333 !important;
            color: white !important;
            text-decoration: none;
        }

    </style>
</head>

<body>


<nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container d-flex justify-content-between align-items-center">


        <div class="d-flex align-items-center">
            <a href="{% url 'menu:menu_home' %}">Our Menu</a>
            <a href="{% url 'deals:deals' %}">Deals</a>
            <a href="{% url 'favourites:view_favourites' %}">Favourites</a>
        </div>

      
        <a class="navbar-brand" href="{% url 'homepage:homepage' %}">KAFEI</a>

     
        <div class="d-flex align-items-center">
            <a href="{% url 'cart:view_cart' %}">Cart</a>
            <a class="nav-link" href="{% url 'about:about' %}">About</a>

            {% if user.is_authenticated %}
                <a href="{% url 'accounts:account_detail' %}" class="login-btn2">
                    My Account
                </a>
            {% else %}
                <a href="{% url 'accounts:login' %}" class="login-btn2">
                    Log in / Sign up
                </a>
            {% endif %}
        </div>

    </div>
</nav>


<div class="container">
    {% block content %}
    {% endblock %}
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

{% block extra_js %}

{% endblock %}

</body>
</html>
