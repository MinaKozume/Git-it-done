{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}KAFEI{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { font-family: Arial, sans-serif; }

        /* Header Navigation */
        .navbar-custom {
            background: white;
            padding: 20px 0;
            border-bottom: 1px solid #eee;
        }
        .navbar-custom a {
            color: black;
            font-size: 1.1rem;
            margin: 0 15px;
            text-decoration: none;
        }
        .navbar-brand {
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .login-btn {
            background: black;
            color: white;
            padding: 10px 18px;
            border-radius: 7px;
            text-decoration: none;
        }

        /* Footer */
        footer {
            background: white;
            padding: 40px 0;
            border-top: 1px solid #eee;
            margin-top: 50px;
        }
        footer h5 {
            font-weight: 600;
        }
        footer a {
            color: black;
            text-decoration: none;
            display: block;
            margin-bottom: 6px;
        }
        .social-icons i {
            font-size: 1.3rem;
            margin-right: 12px;
        }
    </style>
</head>

<body>

<!-- HEADER -->
<nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container d-flex justify-content-between align-items-center">

        <!-- Left Links -->
        <div class="d-flex align-items-center">
            <a href="{% url 'menu:menu_home' %}">Our Menu</a>
            <a href="{% url 'deals:deals' %}">Deals</a>
            <a href="#">Favourites</a>
        </div>

        <!-- Brand -->
        <a class="navbar-brand" href="{% url 'homepage:homepage' %}">KAFEI</a>

        <!-- Right Links -->
        <div class="d-flex align-items-center">
            <a href="#">Cart</a>
            <a class="nav-link" href="{% url 'about:about' %}">About</a>
            <a href="#" class="login-btn">Log in / Sign up</a>
        </div>

    </div>
</nav>

<!-- CONTENT -->
<div class="container">
    {% block content %}
    {% endblock %}
</div>

<!-- FOOTER -->
<footer>
    <div class="container d-flex justify-content-between">

        <div>
            <h4>Kafei</h4>
            <div class="social-icons mt-3">
                <i class="bi bi-facebook"></i>
                <i class="bi bi-linkedin"></i>
                <i class="bi bi-youtube"></i>
                <i class="bi bi-instagram"></i>
            </div>
        </div>

        <div>
            <h5>About Us</h5>
            <a href="#">Landing Page</a>
            <a class="nav-link" href="{% url 'about:about' %}">About</a>
        </div>

        <div>
            <h5>Product</h5>
            <a href="{% url 'menu:menu_home' %}">Menu</a>
            <a href="{% url 'reviews:reviews' %}">Reviews</a>
        </div>

        <div>
            <h5>Deals</h5>
            <a href="{% url 'deals:deals' %}">Deals Page</a>
        </div>

    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
