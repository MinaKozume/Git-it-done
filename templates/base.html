{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}KAFEI{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Page-specific CSS -->
    {% block extra_css %}
    {% endblock %}

    <!-- Common Inline Styles -->
    <style>
        body { font-family: Arial, sans-serif; }

        /* Header Navigation */
        .navbar-custom {
            background: white;
            padding: 20px 0;
            border-bottom: 1px solid #eee;
        }
        .navbar-custom a {
            color: black;
            font-size: 1.1rem;
            margin: 0 15px;
            text-decoration: none;
        }
        .navbar-brand {
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .login-btn {
            background: black;
            color: white;
            padding: 10px 18px;
            border-radius: 7px;
            text-decoration: none;
        }

        /* Footer */
        footer {
            background: white;
            padding: 40px 0;
            border-top: 1px solid #eee;
            margin-top: 50px;
        }
        footer h5 {
            font-weight: 600;
        }
        footer a {
            color: black;
            text-decoration: none;
            display: block;
            margin-bottom: 6px;
        }
        .social-icons i {
            font-size: 1.3rem;
            margin-right: 12px;
        }
        /* Favourite heart button styles */
        .fav-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #fff;
            color: #000;
            border: 1px solid #000;
            padding: 0;
            font-size: 1.1rem;
            line-height: 1;
        }
        .fav-btn .heart-icon,
        .fav-btn .heart-icon-sm {
            width: 16px;
            height: 16px;
            display: inline-block;
            vertical-align: middle;
            /* set svg fill/stroke directly for consistent behaviour */
            fill: #000;
            stroke: #000;
        }
        .fav-btn.fav-active .heart-icon,
        .fav-btn.fav-active .heart-icon-sm {
            fill: #e74c3c; /* red when active */
            stroke: #e74c3c;
        }
    </style>
</head>

<body>

<!-- HEADER -->
<nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container d-flex justify-content-between align-items-center">

        <!-- Left Links -->
        <div class="d-flex align-items-center">
            <a href="{% url 'menu:menu_home' %}">Our Menu</a>
            <a href="{% url 'deals:deals' %}">Deals</a>
            <a href="{% url 'favourites:view_favourites' %}">Favourites</a>
        </div>

        <!-- Brand -->
        <a class="navbar-brand" href="{% url 'homepage:homepage' %}">KAFEI</a>

        <!-- Right Links -->
        <div class="d-flex align-items-center">
            <a href="{% url 'cart:view_cart' %}">Cart</a>
            <a class="nav-link" href="{% url 'about:about' %}">About</a>
            <a href="#" class="login-btn">Log in / Sign up</a>
        </div>

    </div>
</nav>

<!-- CONTENT -->
<div class="container">
    {% block content %}
    {% endblock %}
</div>

<!-- FOOTER -->
<footer>
    <div class="container d-flex justify-content-between flex-wrap">

        <div class="mb-3">
            <h4>Kafei</h4>
            <div class="social-icons mt-3">
                <i class="bi bi-facebook"></i>
                <i class="bi bi-linkedin"></i>
                <i class="bi bi-youtube"></i>
                <i class="bi bi-instagram"></i>
            </div>
        </div>

        <div class="mb-3">
            <h5>About Us</h5>
            <a href="{% url 'homepage:homepage' %}">Landing Page</a>
            <a class="nav-link" href="{% url 'about:about' %}">About</a>
        </div>

        <div class="mb-3">
            <h5>Product</h5>
            <a href="{% url 'menu:menu_home' %}">Menu</a>
            <a href="{% url 'reviews:reviews' %}">Reviews</a>
        </div>

        <div class="mb-3">
            <h5>Deals</h5>
            <a href="{% url 'deals:deals' %}">Deals Page</a>
        </div>

    </div>
</footer>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
// CSRF helper from Django docs
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

document.addEventListener('DOMContentLoaded', function() {
    const csrftoken = getCookie('csrftoken');

        // Delegate click on fav buttons so clicking the button never causes
        // a browser navigation/scroll-to-top even if the button is type=submit.
        // This forwards the action to the existing submit handler (keeps
        // non-JS fallback intact because we dispatch a submit event).
        document.addEventListener('click', function(e){
            const btn = e.target.closest && e.target.closest('button.fav-btn');
            if (!btn) return;
            // prevent default anchor/form behaviour
            e.preventDefault();
            e.stopPropagation();
            const form = btn.closest('form.fav-form');
            if (form) {
                // Trigger the submit event so the form.submit listener handles it.
                form.dispatchEvent(new Event('submit', {cancelable: true}));
            }
        });

    // Intercept favourite forms (add)
    document.querySelectorAll('form.fav-form').forEach(function(form){
        form.addEventListener('submit', function(e){
            // Prevent regular submit to allow AJAX toggle
            e.preventDefault();
            const btn = form.querySelector('button.fav-btn');
            const productId = form.dataset.productId;
            const favId = btn && btn.getAttribute ? btn.getAttribute('data-fav-id') : null;
            console.debug('fav-form submit', {productId, favId, active: btn && btn.classList && btn.classList.contains('fav-active')});

            if (btn && btn.classList.contains('fav-active')) {
                // Currently favourited - need to remove
                if (!favId) {
                    console.warn('Attempting to remove favourite but no fav-id present on button', btn);
                    return;
                }
                const removeUrl = '/favourites/remove/' + favId + '/';
                fetch(removeUrl, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': csrftoken,
                        'X-Requested-With': 'XMLHttpRequest',
                    },
                }).then(r => r.json()).then(data => {
                    console.debug('remove response', data);
                    if (data.deleted) {
                        // toggle UI
                        btn.classList.remove('fav-active');
                        btn.removeAttribute('data-fav-id');
                        btn.setAttribute('aria-pressed','false');
                        // if on favourites page, remove the card
                        const card = btn.closest('.favourite-card');
                        if (card) card.remove();
                    }
                }).catch(err => { console.error('remove failed', err); });
            } else {
                // Not favourited - add
                const addUrl = '/favourites/add/' + productId + '/';
                fetch(addUrl, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': csrftoken,
                        'X-Requested-With': 'XMLHttpRequest',
                    },
                }).then(r => r.json()).then(data => {
                    console.debug('add response', data);
                    if (data.fav_id) {
                        btn.classList.add('fav-active');
                        btn.setAttribute('data-fav-id', data.fav_id);
                        btn.setAttribute('aria-pressed','true');
                    }
                }).catch(err => { console.error('add failed', err); });
            }
        });
    });

    // Intercept remove buttons on favourites page (forms already exist there)
    document.querySelectorAll('form[action*="/favourites/remove/"]').forEach(function(form){
        form.addEventListener('submit', function(e){
            e.preventDefault();
            const btn = form.querySelector('button.heart-btn');
            // Extract item id from action URL (last segment)
            const parts = form.action.replace(/\/$/, '').split('/');
            const itemId = parts[parts.length-1];
            fetch(form.action, {
                method: 'POST',
                headers: {
                    'X-CSRFToken': csrftoken,
                    'X-Requested-With': 'XMLHttpRequest',
                },
            }).then(r => r.json()).then(data => {
                if (data.deleted) {
                    const card = form.closest('.favourite-card');
                    if (card) card.remove();
                    // If menu has heart for this product, update it
                    const menuBtn = document.querySelector('button.fav-btn[data-fav-id="' + data.item_id + '"]');
                    if (menuBtn) {
                        menuBtn.classList.remove('fav-active');
                        menuBtn.removeAttribute('data-fav-id');
                        menuBtn.setAttribute('aria-pressed','false');
                    }
                }
            }).catch(console.error);
        });
    });
});
</script>

{% block extra_js %}
<!-- Page-specific JS can go here -->
{% endblock %}

</body>
</html>
