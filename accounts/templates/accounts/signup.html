{% extends "base.html" %}
{% block title %}Create Account – KAFEI{% endblock %}

{% block content %}

<h2 class="mt-5">Create Your Account</h2>

<form method="POST" class="mt-4">
    {% csrf_token %}

    {{ form.as_p }}

    <button class="btn btn-dark mt-4 w-100">Sign Up</button>
</form>

<p class="mt-3">
    Already have an account? <a href="{% url 'accounts:login' %}">Login</a>
</p>

{% endblock %}
