{% extends "base.html" %}
{% load static %}

{% block title %}Change Password – KAFEI{% endblock %}

{% block content %}

<!-- ============================ Page Styling =============================== -->
<style>
    body {
        background: linear-gradient(to bottom, #FFF9F4, #F5F0E1);
        min-height: 100vh;
    }
    .password-card {
        max-width:500px;
        margin:40px auto;
        background:#F5F0E1;
        border-radius:12px;
        padding:36px;
        box-shadow:0 8px 20px rgba(0,0,0,0.08);
        color:#4B2E2E;
        transition: all 0.3s ease;
    }
    .password-card:hover {
        box-shadow:0 12px 25px rgba(0,0,0,0.15);
        transform: translateY(-3px);
    }
    .password-card input {
        width:100%;
        padding:10px;
        border:1px solid #4B2E2E;
        border-radius:8px;
        outline:none;
        margin-bottom:15px;
        font-size:1rem;
        transition: all 0.3s ease;
    }
    .password-card input:focus {
        border-color: #6B4226;
        box-shadow: 0 0 5px #6B4226;
    }
    .password-card h2 {
        margin-bottom:25px;
        font-weight:bold;
        text-align:center;
    }
    .password-card button {
        width:100%;
        padding:10px;
        background-color:#4B2E2E;
        color:#FFF9F4;
        font-weight:bold;
        border:none;
        border-radius:8px;
        cursor:pointer;
        font-size:1rem;
        transition: all 0.3s ease;
    }
    .password-card button:hover {
        background-color:#6B4226;
    }
    .forgot-link {
        font-size:0.85rem;
        margin-top:5px;
        text-align: center;
    }
    .forgot-link a {
        color:#6B4226;
        text-decoration:underline;
    }
</style>

<!-- ============================ Banner =============================== -->
<div style="width: 100%; height: 400px; position: relative; border-radius: 0 0 20px 20px; overflow: hidden; display: flex; align-items: flex-start; justify-content: flex-end; padding: 20px 60px 0 0; box-sizing: border-box;">
    <img src="{% static 'accounts/images/coffeeback.jpeg' %}" alt="Banner" style="position:absolute; top:0; left:0; width:100%; height:100%; object-fit: cover; z-index:0;">
    <div style="position: relative; z-index:1; color:#FFF9F4; text-align: right; display: flex; flex-direction: column; gap:8px;">
        <h1 style="font-size: 3rem; margin:0; font-weight:bold;">
            Welcome, {{ user.username }}!
        </h1>
        <p style="font-size:1.5rem; margin:0; font-weight:500;">
            Savor every sip with us
        </p>
        <a href="{% url 'accounts:account_detail' %}" style="align-self: flex-end; padding:8px 16px; background-color:#4B2E2E; color:#FFF9F4; font-weight:bold; font-size:1rem; border-radius:6px; text-decoration:none; transition:0.3s;">
            Back to My Account
        </a>
    </div>
</div>

<!-- ============================ Change Password Card =============================== -->
<div class="password-card">
    <h2>Change Your Password</h2>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <p class="forgot-link">
            <a href="{% url 'accounts:password_reset' %}">Forgot password?</a>
        </p>

        <button type="submit">Update Password</button>
    </form>
</div>

{% endblock %}
