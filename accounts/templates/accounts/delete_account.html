{% extends "base.html" %}
{% block title %}Delete Account – KAFEI{% endblock %}

{% block content %}
<h2 class="mt-5 text-danger">Delete Account</h2>

<p class="mt-3">Enter your password to confirm deletion.</p>

<form method="POST" class="mt-4">
    {% csrf_token %}

    <label>Password</label>
    <input type="password" name="password" class="form-control" required>

    <button class="btn btn-danger mt-4 w-100">Delete Account</button>
</form>

{% endblock %}
