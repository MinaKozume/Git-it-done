<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Password Reset – KAFEI</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
    <p>Hi {{ user.get_username }},</p>

    <p>You requested a password reset for your KAFEI account.</p>

    <p>Click the link below to reset your password:</p>
    <p>
        <a href="{{ protocol }}://{{ domain }}{% url 'accounts:password_reset_confirm' uidb64=uid token=token %}" 
           style="background-color: #333; color: #fff; padding: 10px 20px; text-decoration: none; border-radius: 5px;">
           Reset Password
        </a>
    </p>

    <p>If you did not request this password reset, you can safely ignore this email.</p>

    <p>Thanks,<br>KAFEI Team</p>
</body>
</html>
