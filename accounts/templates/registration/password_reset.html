{% extends "base.html" %}
{% load static %}

{% block title %}Reset Password – KAFEI{% endblock %}

{% block content %}
<div class="col-md-6 mx-auto mt-5 mb-5">

    <h2 class="mb-4 text-center">Reset Your Password</h2>
    <p class="text-muted text-center">Enter the email associated with your account and we will send you a link to reset your password.</p>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-dark w-100 mt-3">Send Reset Link</button>
    </form>

    <div class="text-center mt-3">
        <a href="{% url 'accounts:login' %}">Back to Login</a>
    </div>
</div>
{% endblock %}
