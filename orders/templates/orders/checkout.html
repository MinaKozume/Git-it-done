{% extends "base.html" %}
{% load static %}

{% block title %}Checkout – KAFEI{% endblock %}

{% block content %}
<h2 class="mt-4">Checkout</h2>

<form method="POST" action="{% url 'orders:place_order' %}">
    {% csrf_token %}

    <!-- Email -->
    <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control"
               value="{{ user_email }}" required>
    </div>

    <!-- Payment Method -->
    <h4 class="mt-4">Payment Method</h4>

    <div class="form-check mt-2">
        <input class="form-check-input" type="radio" name="payment_method" value="BANK" checked id="payBank">
        <label class="form-check-label" for="payBank">
            Bank transfer
        </label>
    </div>

    <div class="form-check mt-2">
        <input class="form-check-input" type="radio" name="payment_method" value="CASH" id="payCash">
        <label class="form-check-label" for="payCash">
            Cash on pickup
        </label>
    </div>

    <!-- BANK SECTION -->
    <div id="bankSection" class="mt-4">
        <h5>Scan this QR code to pay</h5>
        <img src="{% static 'images/qr-kafei.png' %}" width="180">

        <div class="mt-3">
            <label class="form-label">Phone number used for transfer</label>
            <input type="text" name="bank_phone" class="form-control">
        </div>

        <div class="mt-2">
            <label class="form-label">Note (optional)</label>
            <textarea name="bank_note" class="form-control"></textarea>
        </div>
    </div>

    <!-- CASH SECTION -->
    <div id="cashSection" class="mt-4" style="display:none;">
        <label class="form-label">Pickup Name</label>
        <input type="text" name="pickup_name" class="form-control">

        <label class="form-label mt-2">Phone</label>
        <input type="text" name="pickup_phone" class="form-control">
    </div>

    <!-- TOTAL -->
    <div class="mt-4 p-3 border">
        <h5>Total: Rs {{ total }}</h5>
    </div>

    <button class="btn btn-dark mt-4 w-100">Confirm Payment</button>
</form>

<script>
const bankPhone = document.querySelector("input[name='bank_phone']");
const bankNote = document.querySelector("textarea[name='bank_note']");
const pickupName = document.querySelector("input[name='pickup_name']");
const pickupPhone = document.querySelector("input[name='pickup_phone']");

document.getElementById("payBank").addEventListener("change", function() {
    document.getElementById("bankSection").style.display = "block";
    document.getElementById("cashSection").style.display = "none";

    bankPhone.required = true;
    pickupName.required = false;
    pickupPhone.required = false;
});

document.getElementById("payCash").addEventListener("change", function() {
    document.getElementById("bankSection").style.display = "none";
    document.getElementById("cashSection").style.display = "block";

    bankPhone.required = false;
    pickupName.required = true;
    pickupPhone.required = true;
});
</script>

{% endblock %}
