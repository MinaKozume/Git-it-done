{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}KAFEI{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* General Styles */
        body { font-family: Arial, sans-serif; }

        /* Sidebar */
        .sidebar {
            width: 220px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #f8f9fa;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            border-right: 1px solid #ddd;
        }
        .sidebar .navbar-brand {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 2rem;
        }
        .sidebar .nav-link {
            font-size: 1.1rem;
            color: #000;
            margin-bottom: 0.75rem;
            transition: background 0.3s, color 0.3s;
        }
        .sidebar .nav-link:hover {
            background-color: #e0e0e0;
            border-radius: 8px;
            color: #000;
        }
        .sidebar .btn-dark {
            width: 100%;
            margin-top: 1.5rem;
            border-radius: 8px;
        }

        /* Hero section (can be overridden) */
        .hero {
            background: url('{% block hero_image %}{% static "deals/images/coffee-beans.jpg" %}{% endblock %}') center/cover no-repeat;
            color: white;
            text-align: center;
            padding: 150px 20px 100px;
            position: relative;
        }
        .hero-overlay {
            position: absolute;
            inset:0;
            background: rgba(0,0,0,0.5);
            z-index: 0;
        }
        .hero-content {
            position: relative;
            z-index: 1;
        }

        /* Cards and images */
        .card-img-top, img.img-fluid {
            height: 200px;
            object-fit: cover;
            border-radius: 12px;
        }
        .deal-card {
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s;
        }
        .deal-card:hover {
            transform: translateY(-5px);
        }

        /* Buttons */
        .btn-dark {
            background-color: #000;
            border: none;
            color: #fff;
        }
        .btn-dark:hover { background-color: #333; }
        .btn-outline-secondary { border-radius: 5px; }

        /* Footer */
        .footer { border-top: 1px solid #ddd; padding: 20px 0; }
        .footer a { text-decoration: none; color: #000; }

        /* Adjust content for sidebar */
        .main-content {
            margin-left: 240px;
            padding: 20px 0;
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<nav class="sidebar">
    <a class="navbar-brand" href="#">KAFEI</a>
    <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link" href="#">Our Menu</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Deals</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Favourites</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Cart</a></li>
        <li class="nav-item"><a class="nav-link" href="#">About</a></li>
        <li class="nav-item"><a class="btn btn-dark" href="#">Login</a></li>
    </ul>
</nav>

<!-- Hero section (can be overridden) -->
{% block hero %}{% endblock %}

<!-- Main content -->
<div class="container main-content">
    {% block content %}{% endblock %}
</div>

<!-- Footer -->
<footer class="footer text-center bg-light">
    <div class="container">
        <p>&copy; 2025 KAFEI. All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
