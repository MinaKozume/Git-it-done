{% extends "base.html" %}
{% block title %}Menu{% endblock %}

{% block content %}
<h1>Our Menu</h1>

<div class="product-grid">
    {% for product in products %}
    <div class="product-card">
        <a href="{% url 'products:product_detail' product.id %}">
            <img src="{{ product.image.url }}" alt="{{ product.name }}">
        </a>
        <h3>{{ product.name }}</h3>
        <p>Rs {{ product.price }}</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
