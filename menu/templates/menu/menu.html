{% extends "base.html" %}
{% load static %}

{% block title %}KAFEI — Menu{% endblock %}

{% block content %}

<!-- HERO BANNER -->
<div class="text-white text-center" style="
    background-image: url('{% static 'menu/images/coffee_brewing_methods-1.jpg' %}');
    background-size: cover;
    background-position: center;
    height: 60vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
">
    <h1 class="fw-bold">Brewed Fresh. Served with Love.</h1>
    <a href="#menu-section" class="btn btn-light mt-3">View Menu</a>
</div>

<!-- CATEGORY PREVIEW -->
<div class="container my-5">
    <h2 class="text-center mb-4">Categories</h2>
    <div class="row text-center" id="categories-container"></div>
</div>

<!-- MAIN MENU -->
<div class="container" id="menu-section">
    <div id="menu-container"></div>
</div>

<!-- ADDED TO CART POPUP -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
    <div id="cartToast" class="toast align-items-center text-white bg-success border-0" role="alert">
        <div class="d-flex">
            <div class="toast-body">Item added to cart!</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<!-- STYLES -->
<style>
.scroll-container {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
}

.scroll-container::-webkit-scrollbar {
    display: none;
}

.scroll-item {
    flex: 1 1 calc(25% - 15px);
    min-width: 200px;
    max-width: 250px;
}

.scroll-item .card {
    height: 360px;
    display: flex;
    flex-direction: column;
}

.scroll-item .card-img-top {
    height: 180px;
    object-fit: cover;
}

.scroll-item .card-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.scroll-item p {
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    margin-bottom: 0.5rem;
}

.btn-dark-brown {
    background-color: #1C0A07;
    color: white;
}

.btn-light-cream {
    background-color: #F5F5DC;
    color: #1C0A07;
}
</style>

<script>
fetch("/menu/api/")
    .then(response => response.json())
    .then(data => {
        console.log(data);

        const categoriesContainer = document.getElementById("categories-container");
        const menuContainer = document.getElementById("menu-container");

        const grouped = {};

        data.forEach(item => {
            const categoryId = item.category.id;
            const categoryName = item.category.name;
            const categoryImage = item.category.image;

            if (!grouped[categoryId]) {
                grouped[categoryId] = {
                    name: categoryName,
                    image: categoryImage,
                    items: []
                };
            }

            grouped[categoryId].items.push(item);
        });

        Object.entries(grouped).forEach(([catId, category]) => {

            categoriesContainer.innerHTML += `
                <div class="col-6 col-md-3 mb-4">
                    <a href="#cat-${catId}" class="text-decoration-none text-dark">
                        <div class="card">
                            ${category.image ? `
                                <img src="${category.image}" 
                                     class="card-img-top" 
                                     style="height: 120px; object-fit: cover;">
                            ` : ""}
                            <div class="card-body p-2">
                                <h6>${category.name}</h6>
                            </div>
                        </div>
                    </a>
                </div>
            `;

            let itemsHTML = `
                <h3 id="cat-${catId}" class="mt-5">${category.name}</h3>
                <div class="scroll-container">
            `;

            category.items.forEach(item => {
                itemsHTML += `
                    <div class="card scroll-item">
                        ${item.image ? `
                            <img src="${item.image}" class="card-img-top">
                        ` : ""}

                        <div class="card-body">
                            <div>
                                <h5>${item.name}</h5>
                                <p>${item.description}</p>
                                <p class="fw-bold">Rs ${item.price}</p>
                            </div>

                            <div class="d-flex gap-2 mt-2">
                                <button class="btn btn-dark-brown"
                                    onclick="addToCart(${item.id})">
                                    Add to Cart
                                </button>

                                <a href="/menu/item/${item.id}/"
                                   class="btn btn-light-cream">
                                   View Details
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            });

            itemsHTML += `</div>`;

            menuContainer.innerHTML += itemsHTML;
        });
    })
    .catch(error => {
        console.error("Menu API Error:", error);
    });


function addToCart(id) {
    const token = localStorage.getItem("token");
    
    if (!token) {
        alert("Please login first");
        window.location.href = "/accounts/login/";
        return;
    }
    
    fetch("/cart/api/add/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
        },
        body: JSON.stringify({
            item_type: "MENU",
            item_id: id,
            quantity: 1
        })
    })
    .then(res => {
        if (res.status === 401) {
            throw new Error("Session expired. Please login again.");
        }
        return res.json();
    })
    .then(data => {
        let toastEl = document.getElementById("cartToast");
        let toast = new bootstrap.Toast(toastEl, {
            animation: true,
            autohide: true,
            delay: 2000
        });
        toast.show();
    })
    .catch(err => {
        console.error(err);
        alert(err.message);
    });
}
</script>

{% endblock %}
