{% extends "base.html" %}
{% block title %}Add Review - KAFEI{% endblock %}

{% block content %}

<div style="max-width:600px; margin:auto; padding:40px;">
    <h1>Leave a Review</h1>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" style="margin-top:20px; background:black; color:white; padding:10px 20px;">Submit Review</button>
    </form>
</div>

{% endblock %}
